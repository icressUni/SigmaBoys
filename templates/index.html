<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Cámara</title>
  <style>
    :root {
      --primary-color: #a0d2eb;
      --secondary-color: #e5eaf5;
      --accent-color: #d0bdf4;
      --text-color: #494c4e;
      --border-radius: 20px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: var(--secondary-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      margin: 20px 0;
      color: var(--text-color);
      font-weight: 300;
      letter-spacing: 1px;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .form-container {
      background-color: white;
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    input {
      padding: 12px 15px;
      border: 1px solid #e1e1e1;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s;
      width: 100%;
    }
    
    input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(208, 189, 244, 0.3);
    }
    
    video, canvas {
      display: block;
      margin: 0 auto;
      transform: scaleX(-1);
      border-radius: var(--border-radius);
      max-width: 100%;
      height: auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      background-color: #333;
    }
    
    button {
      display: block;
      margin: 20px auto;
      padding: 12px 25px;
      font-size: 1rem;
      background-color: var(--primary-color);
      color: var(--text-color);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    button:hover:not(:disabled) {
      background-color: var(--accent-color);
      transform: translateY(-2px);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Custom alert popup */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    
    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .popup-content {
      background-color: white;
      padding: 25px;
      border-radius: var(--border-radius);
      max-width: 90%;
      width: 400px;
      text-align: center;
      transform: translateY(20px);
      transition: all 0.3s;
    }
    
    .popup-overlay.active .popup-content {
      transform: translateY(0);
    }
    
    .popup-close {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .form-container {
        padding: 20px;
      }
      
      video, canvas {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Captura de Cámara</h1>

    <div class="form-container">
      <!-- Campos de usuario -->
      <div class="input-group">
        <input id="nameInput" type="text" placeholder="Nombre completo" required />
        <input id="emailInput" type="email" placeholder="Correo electrónico" required />
      </div>
    </div>

    <!-- Vista previa de la cámara -->
    <video id="video" width="640" height="480" autoplay playsinline></video>
    <button id="snap" disabled>Tomar Foto</button>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
  </div>

  <!-- Custom popup instead of alert -->
  <div class="popup-overlay" id="customPopup">
    <div class="popup-content">
      <h3>Foto guardada correctamente</h3>
      <p>Guardado con ID: <span id="imageId"></span></p>
      <button class="popup-close" id="closePopup">Cerrar</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snap');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const ctx = canvas.getContext('2d');
    const customPopup = document.getElementById('customPopup');
    const imageIdSpan = document.getElementById('imageId');
    const closePopupBtn = document.getElementById('closePopup');

    let cameraReady = false;

    // 1. Solicitar permiso y arrancar cámara
    window.addEventListener('load', () => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          cameraReady = true;
          checkReady();
        })
        .catch(err => {
          console.error('Error accediendo a la cámara:', err);
          alert('No se pudo acceder a la cámara.');
        });
    });

    // 2. Habilitar botón solo si nombre, email y cámara listos
    function checkReady() {
      const nameOk = nameInput.value.trim() !== '';
      const emailOk = emailInput.checkValidity();
      snapBtn.disabled = !(cameraReady && nameOk && emailOk);
    }

    nameInput.addEventListener('input', checkReady);
    emailInput.addEventListener('input', checkReady);

    // Custom popup functions
    function showPopup(id) {
      imageIdSpan.textContent = id;
      customPopup.classList.add('active');
    }

    closePopupBtn.addEventListener('click', () => {
      customPopup.classList.remove('active');
    });

    // 3. Capturar y enviar foto y datos
    snapBtn.addEventListener('click', () => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/png');

      fetch('/save_photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imageData: dataURL,
          name: nameInput.value.trim(),
          email: emailInput.value.trim()
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          showPopup(data.id); // Use custom popup instead of alert
        } else {
          alert('Error guardando la foto');
        }
      })
      .catch(err => {
        console.error('Error de fetch:', err);
        alert('Error de comunicación con el servidor.');
      });
    });
  </script>
</body>
</html>
